<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" width="960" height="512" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,monospace" role="img" aria-label="FaceCheck Pro architecture: a real-time RAM-only query path and an offline crawl-and-seed index path, sharing a ChromaDB vector store. No photos are stored, only 512-float vectors plus source URLs.">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#52525b"/>
    </marker>
    <marker id="arwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3f3f46"/>
    </marker>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="960" height="512" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="959" height="511" fill="none" stroke="#1c1c1f"/>

  <!-- header -->
  <text x="24" y="30" fill="#a1a1aa" font-size="14" letter-spacing="0.5">facecheck-pro — architecture</text>
  <text x="24" y="48" fill="#52525b" font-size="11.5">no photos stored — only 512-float vectors + source URLs</text>

  <!-- =================== LANE 1: QUERY =================== -->
  <text x="24" y="82" fill="#8a8a93" font-size="12" letter-spacing="1">1 &#183; QUERY  —  real-time, RAM-only</text>

  <!-- boxes: 6 across, width 130, gap 24, start x=24, y=94 h=64 -->
  <g stroke="#3f3f46" fill="#111114">
    <rect x="24"  y="94" width="130" height="64" rx="6"/>
    <rect x="178" y="94" width="130" height="64" rx="6"/>
    <rect x="332" y="94" width="130" height="64" rx="6"/>
    <rect x="486" y="94" width="130" height="64" rx="6"/>
    <rect x="640" y="94" width="130" height="64" rx="6"/>
    <rect x="794" y="94" width="130" height="64" rx="6"/>
  </g>
  <g font-size="12" fill="#d4d4d8" text-anchor="middle">
    <text x="89"  y="120">Browser</text>
    <text x="243" y="120">Next.js proxy</text>
    <text x="397" y="120">FastAPI</text>
    <text x="551" y="120">SCRFD</text>
    <text x="705" y="120">ArcFace R50</text>
    <text x="859" y="120">ChromaDB</text>
  </g>
  <g font-size="10" fill="#71717a" text-anchor="middle">
    <text x="89"  y="137">face-api.js</text>
    <text x="89"  y="150">(instant UX)</text>
    <text x="243" y="137">:3000</text>
    <text x="243" y="150">/api/search</text>
    <text x="397" y="137">:8000</text>
    <text x="397" y="150">orchestrator</text>
    <text x="551" y="137">detect face</text>
    <text x="551" y="150">bounding box</text>
    <text x="705" y="137">embed</text>
    <text x="705" y="150">→ 512-d vector</text>
    <text x="859" y="137">HNSW cosine</text>
    <text x="859" y="150">top-K search</text>
  </g>
  <!-- arrows lane1 -->
  <g stroke="#52525b" stroke-width="1.4" marker-end="url(#arw)">
    <line x1="154" y1="126" x2="176" y2="126"/>
    <line x1="308" y1="126" x2="330" y2="126"/>
    <line x1="462" y1="126" x2="484" y2="126"/>
    <line x1="616" y1="126" x2="638" y2="126"/>
    <line x1="770" y1="126" x2="792" y2="126"/>
  </g>

  <!-- results return + direct-image note -->
  <path d="M859 158 L859 184 L89 184 L89 160" fill="none" stroke="#3f3f46" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arwd)"/>
  <text x="474" y="180" fill="#71717a" font-size="10.5" text-anchor="middle">results: [ match_score + source_url ]  →  browser</text>
  <text x="474" y="206" fill="#52525b" font-size="10.5" text-anchor="middle">result photos load direct from origin (fbi.gov / CDN) into the browser — never through the search server</text>

  <!-- =================== LANE 2: INDEX =================== -->
  <text x="24" y="248" fill="#8a8a93" font-size="12" letter-spacing="1">2 &#183; INDEX  —  offline crawl + seed</text>

  <!-- 5 boxes, width 150, gap 42, start x=24, y=260 h=64 -->
  <g stroke="#3f3f46" fill="#111114">
    <rect x="24"  y="260" width="150" height="64" rx="6"/>
    <rect x="216" y="260" width="150" height="64" rx="6"/>
    <rect x="408" y="260" width="150" height="64" rx="6"/>
    <rect x="600" y="260" width="150" height="64" rx="6"/>
    <rect x="792" y="260" width="132" height="64" rx="6"/>
  </g>
  <g font-size="12" fill="#d4d4d8" text-anchor="middle">
    <text x="99"  y="286">Crawlers</text>
    <text x="291" y="286">download img</text>
    <text x="483" y="286">SCRFD + ArcFace</text>
    <text x="675" y="286">store record</text>
    <text x="858" y="286">ChromaDB</text>
  </g>
  <g font-size="10" fill="#71717a" text-anchor="middle">
    <text x="99"  y="303">FBI · Interpol</text>
    <text x="99"  y="316">registries · news</text>
    <text x="291" y="303">→ RAM only</text>
    <text x="291" y="316">httpx GET</text>
    <text x="483" y="303">embed image</text>
    <text x="483" y="316">→ 512-d vector</text>
    <text x="675" y="303">512 floats + url</text>
    <text x="675" y="316">+ metadata</text>
    <text x="858" y="303">faces index</text>
    <text x="858" y="316">(shared)</text>
  </g>
  <g stroke="#52525b" stroke-width="1.4" marker-end="url(#arw)">
    <line x1="174" y1="292" x2="214" y2="292"/>
    <line x1="366" y1="292" x2="406" y2="292"/>
    <line x1="558" y1="292" x2="598" y2="292"/>
    <line x1="750" y1="292" x2="790" y2="292"/>
  </g>
  <text x="291" y="344" fill="#52525b" font-size="10.5" text-anchor="middle">image bytes discarded after embed — nothing written to disk except the vector</text>

  <!-- =================== STORAGE CALLOUT =================== -->
  <rect x="24" y="366" width="912" height="120" rx="6" fill="#0e0e11" stroke="#2a2a2e"/>
  <text x="44" y="392" fill="#8a8a93" font-size="12" letter-spacing="1">THE STORAGE INSIGHT</text>
  <g font-size="13" fill="#d4d4d8">
    <text x="44" y="420">1,400,000,000 faces  ×  2,048 bytes   =   2.8 TB      <tspan fill="#71717a" font-size="11">(vectors only)</tspan></text>
    <text x="44" y="444">+ source URL + metadata  ≈  9 KB / face   ≈   13 TB   <tspan fill="#71717a" font-size="11">(full index)</tspan></text>
  </g>
  <text x="44" y="470" fill="#a1a1aa" font-size="12">= one hard drive. The photos stay on fbi.gov / instagram / vk — the index never copies them.</text>
</svg>
